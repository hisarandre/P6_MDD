<section class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
  <button
    mat-raised-button
    color="primary"
    class="py-4 px-6 rounded-xl font-semibold"
    routerLink="/posts/create"
  >
    <div class="flex items-center justify-center">
      <span>Créer un article</span>
    </div>
  </button>

  <button
    (click)="toggleSort()"
    class="flex items-center gap-2 bg-transparent border-none outline-none p-0 m-0 cursor-pointer"
  >
    <span class="font-semibold">Trier par</span>
    <div>
      @if (sortAscending) {
        <mat-icon class="!w-5 !h-5">arrow_upward</mat-icon>
      } @else {
        <mat-icon class="!w-5 !h-5">arrow_downward</mat-icon>
      }
    </div>
  </button>
</section>

<app-posts-list
  [sortAscending]="sortAscending"
></app-posts-list>
