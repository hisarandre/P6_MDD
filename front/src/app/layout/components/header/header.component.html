<div class="h-screen bg-white relative">

  <!-- Mobile Drawer -->
  @if(showNavbar && isMobile && (isLoggedIn$ | async)) {

    <!-- Overlay -->
    @if(isSidenavOpen) {
      <div
        class="fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity duration-300"
        (click)="closeSidenav()">
      </div>
    }

    <!-- Drawer Panel -->
    <div
      class="fixed inset-y-0 right-0 z-50 w-64 transform transition-transform duration-300 ease-in-out"
      [style.transform]="isSidenavOpen ? 'translateX(0)' : 'translateX(100%)'">

      <div class="bg-white shadow-xl flex flex-col h-full">

        <!-- Links -->
        <div class="flex-1 flex flex-col p-4 space-y-4">
          <button
            class="text-right text-red-700 !font-bold !text-lg !bg-transparent !border-none"
            (click)="logout(); closeSidenav()">
            Se déconnecter
          </button>

          <button
            class="text-right font-medium !text-xl hover:bg-gray-50 w-full !bg-transparent !border-none"
            [class.text-primary]="router.url === '/posts'"
            (click)="navigateAndClose('/posts')">
            Articles
          </button>

          <button
            class="text-right font-medium !text-xl hover:bg-gray-50 w-full !bg-transparent !border-none"
            [class.text-primary]="router.url === '/subjects'"
            (click)="navigateAndClose('/subjects')">
            Thèmes
          </button>
        </div>

        <!-- Footer / Account -->
        <div class="p-4 flex justify-end">
          <button
            (click)="navigateAndClose('/me')"
            class="rounded-full w-12 h-12 flex items-center justify-center border-2 transition-colors"
            [ngClass]="{
              'bg-gray-200 border-primary': router.url === '/me',
              'bg-gray-200 border-transparent hover:bg-gray-300': router.url !== '/me'
            }"
          >
            <mat-icon
              class="text-2xl block leading-none"
              [ngClass]="{'text-primary': router.url === '/me', 'text-gray-700': router.url !== '/me'}"
            >
              person
            </mat-icon>
          </button>
        </div>

      </div>
    </div>
  }

  <!-- Main Content -->
  <div class="flex flex-col">

    <!-- Toolbar / Navbar -->
    @if(showNavbar) {
      <mat-toolbar class="border-b border-gray-300 flex justify-between items-center px-4 h-14 z-10 sticky top-0">
        <!-- Logo -->
        <div class="navbar-brand flex items-center h-full cursor-pointer" routerLink="/">
          <img src="../../../../assets/logo_p6.png" alt="Logo MDD" class="h-full w-auto object-contain"/>
        </div>

        <!-- Desktop navigation -->
        <div class="hidden md:flex space-x-4 items-center">
          @if(isLoggedIn$ | async) {
            <a
              mat-button
              (click)="logout()"
              class="!text-red-700 font-medium"
            >
              Se déconnecter
            </a>
            <a
              mat-button
              routerLink="posts"
              routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              Articles
            </a>
            <a
              mat-button
              routerLink="subjects"
              routerLinkActive="active-link"
            >
              Thèmes
            </a>
            <a routerLink="me" routerLinkActive="active-link">
              <button
                mat-icon-button
                class="rounded-full w-10 h-10 flex items-center justify-center !p-0 !bg-gray-200 !text-gray-700 box-border"
              >
                <mat-icon class="text-2xl block leading-none pt-1">person</mat-icon>
              </button>
            </a>

          }
        </div>

        <!-- Mobile menu button -->
        @if(isMobile && (isLoggedIn$ | async)) {
          <button mat-icon-button class="md:hidden text-gray-700" (click)="toggleSidenav()">
            <mat-icon>{{ isSidenavOpen ? 'close' : 'menu' }}</mat-icon>
          </button>
        }
      </mat-toolbar>
    }

    <!-- Page content -->
    <div class="flex-1 p-4 bg-gray-50">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
